        <button id="btnSubmitAbnormal" onclick="showAbnormal()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-black text-sm shadow-md transition-all">⚠️ 發現異常？填寫回報</button>
      </div>
      
      <div id="abnormalForm" class="hidden flat-card border-2 border-red-500 bg-red-50/50 mt-4">
        <h4 id="lblAbnormalTitle" class="text-red-700 font-black text-xs mb-3">請點選現場異常項目：</h4>
        <div id="abnormalChips" class="flex flex-wrap gap-2 mb-4"></div>
        <textarea id="reason" placeholder="其他補充說明..." class="w-full p-3 rounded-xl border border-slate-200 h-20 mb-4 text-xs bg-white outline-none"></textarea>
        <button id="btnConfirmAbnormal" onclick="submitData('異常')" class="w-full bg-red-600 text-white py-3 rounded-xl font-black text-sm shadow-md">確認送出異常回報</button>
      </div>
    </div>

    <div id="lockUI" class="hidden flat-card text-center py-8 border-2 border-yellow-500 bg-yellow-50/50 my-4 rounded-2xl">
      <p class="text-5xl mb-3">🛑</p>
      <p id="lockTitle" class="text-base font-black text-slate-800">此設備本月已完成點檢</p>
      <p id="lockSub" class="text-xs text-slate-500 mt-1">ระบบได้รับการตรวจสอบในเดือนนี้แล้ว</p>
      <p id="lockIdDisplay" class="text-xs text-slate-600 font-mono font-bold bg-white/90 py-1.5 px-4 rounded-xl inline-block border border-slate-200 mt-3 shadow-sm">--</p>
    </div>
  </main>
  
  <div id="msg" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-8 text-center">
    <div class="bg-white p-8 rounded-[32px] shadow-2xl w-full max-w-xs">
      <div id="statusIcon" class="text-5xl mb-4">✅</div>
      <div id="statusText" class="text-xl font-black text-slate-800 italic">傳送成功</div>
      <button id="btnFinish" onclick="location.reload()" class="w-full bg-sky-600 text-white py-4 rounded-2xl font-black text-base mt-6">完成</button>
    </div>
  </div>

<script>
  let selectedAbnormalItems = new Set();
  let currentWorkType = "常規點檢"; 
  let currentLang = "zh"; 
  let dbLocation = "茶水間"; 
  let dbStatusText = ""; 
  let isSubmitting = false;
  
  let realPdfNameZh = "";
  let realPdfNameTh = "";

  if (typeof window.wdDoneList === 'undefined') {
    window.wdDoneList = new Set();
  }

  const langPack = {
    zh: {
      lblInspector: "點檢執行人", placeholderInspector: "輸入姓名",
      scanQrPrompt: "請先掃描設備上的二維碼以載入資料",
      routine: "常規點檢", clean: "清洗保養", location: "正確位置：",
      reportTitle: "📄 水質合格檢驗報告", statusText: "最新檢測狀態：", passTag: " (合格)",
      viewReport: "🔍 點擊開啟最新一期檢驗報告", confirmTitle: "📋 飲水機現場確認",
      btnNormal: "🛡️ 項目皆正常並送出", btnAbnormal: "⚠️ 發現異常？填寫回報",
      abTitle: "請點選現場異常項目：", placeholderReason: "其他補充說明...", abSend: "確認送出異常回報",
      items: ["面板燈號、溫度顯示正常", "機體周邊與底部無漏水現象", "出水口保持清潔、無異物殘留", "接水盤排水順暢、無積水阻塞"],
      chips: ["面板無顯示", "機身漏水", "出水有異味", "接水盤阻塞"],
      alertName: "請填寫姓名！", sending: "資料傳送中...", success: "點檢完成！資料已同步", fail: "後端同步失敗", netFail: "網路連線失敗", finish: "完成",
      alreadyDone: "此設備本月已完成點檢"
    },
    th: {
      lblInspector: "ผู้ตรวจสอบ", placeholderInspector: "ใส่ชื่อของคุณ",
      scanQrPrompt: "โปรดสแกนคิวอาร์โค้ดบนอุปกรณ์เพื่อโหลดข้อมูล",
      routine: "ตรวจสอบประจำ", clean: "ล้างบำรุงรักษา", location: "ตำแหน่งที่ถูกต้อง: ",
      reportTitle: "📄 รายงานผลตรวจสอบคุณภาพน้ำผ่านเกณฑ์", statusText: "สถานะล่าสุด: ", passTag: " (ผ่านเกณฑ์)",
      viewReport: "🔍 คลิกเพื่อดูรายงานผลการตรวจสอบล่าสุด", confirmTitle: "📋 รายงานตรวจสอบตู้กดน้ำ",
      btnNormal: "🛡️ ทุกรายการปกติและส่งข้อมูล", btnAbnormal: "⚠️ พบสิ่งผิดปกติ? แจ้งซ่อม",
      abTitle: "โปรดเลือกรายการที่ผิดปกติ:", placeholderReason: "คำอธิบายเพิ่มเติม...", abSend: "ยืนยันการส่งรายงานผิดปกติ",
      items: ["ไฟหน้าจอและอุณหภูมิ顯示正常", "ไม่มีน้ำรั่วซึมรอบตัวเครื่องและด้านล่าง", "หัวจ่ายน้ำสะอาด ไม่มีสิ่งแปลกปลอม", "ถาดรองน้ำระบายได้ดี ไม่มีน้ำขังอุดตัน"],
      chips: ["หน้าจอไม่แสดงผล", "น้ำรั่วซึม", "น้ำมีกลิ่นผิดปกติ", "ถาดรองน้ำอุดตัน"],
      alertName: "กรุณาใส่ชื่อของคุณ!", sending: "กำลังส่งข้อมูล...", success: "เสร็จสิ้น! ข้อมูลบันทึกแล้ว", fail: "การส่งข้อมูลล้มเหลว", netFail: "การเชื่อมต่อเครือข่ายล้มเหลว", finish: "เสร็จสิ้น",
      alreadyDone: "ระบบได้รับการตรวจสอบในเดือนนี้แล้ว"
    }
  };

  function getInspectedKey(eqId) {
    const now = new Date();
    return `wd_done_${eqId}_${now.getFullYear()}_${now.getMonth() + 1}`;
  }

  function showLockedUI(eqId) {
    document.getElementById('mainUI').classList.add('force-hide');
    document.getElementById('lockUI').classList.remove('hidden');
    document.getElementById('lockIdDisplay').innerText = eqId;
    document.getElementById('lockTitle').innerText = langPack[currentLang].alreadyDone;
  }

  // 🛠️ 精準定位：如果是消防設備代號，自動秒轉至妳的消防點檢系統
  function handleCrossSystemRedirect(cleanId) {
    const upperId = cleanId.toUpperCase();
    // 判斷消防常見編號前綴（如滅火器 DCP/CO2、消防栓 FH、緊急照明 EP）
    if (upperId.includes("DCP") || upperId.includes("CO2") || upperId.includes("FH") || upperId.includes("EP")) {
      alert("💡 偵測到此條碼屬於【消防設施】，系統將自動為您切換至消防點檢網頁！");
      // 直接精準導向妳的消防專屬網站並帶入 ID 參數
      window.location.href = "https://amyjacky1938-star.github.io/fire-check/?id=" + upperId;
      return true;
    }
    return false;
  }

  // 📷 啟用內嵌相機與拆解
  function startScanner() {
    const readerDiv = document.getElementById('reader');
    readerDiv.classList.remove('hidden');
    
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      (decodedText) => {
        html5QrCode.stop().then(() => {
          readerDiv.classList.add('hidden');
          let cleanId = decodedText.trim();
          
          if (cleanId.includes('eqId=')) {
            cleanId = cleanId.split('eqId=')[1].split('&')[0];
          } else if (cleanId.includes('id=')) {
            cleanId = cleanId.split('id=')[1].split('&')[0];
          } else if (cleanId.includes('/')) {
            const parts = cleanId.split('/');
            cleanId = parts[parts.length - 1];
          }
          
          // 🛑 掃描時防呆跳轉
          if (handleCrossSystemRedirect(cleanId)) return;
          
          window.location.href = window.location.origin + window.location.pathname + "?id=" + cleanId.toUpperCase();
        });
      },
      (errorMessage) => { }
    ).catch(err => alert("無法開啟相機：" + err));
  }

  function parseExcelDate(serial) {
    if (!serial || isNaN(serial)) return serial;
    const num = parseInt(serial, 10);
    const utc_days  = num - 25569;
    const utc_value = utc_days * 86400;
    const date_info = new Date(utc_value * 1000);
    return `${date_info.getFullYear()}/${date_info.getMonth() + 1}/${date_info.getDate()}`;
  }

  function switchLang(lang) {
    currentLang = lang;
    const p = langPack[lang];
    
    document.getElementById('langZh').className = lang === 'zh' ? "px-2 py-1 rounded-lg bg-white text-sky-900 shadow" : "px-2 py-1 rounded-lg";
    document.getElementById('langTh').className = lang === 'th' ? "px-2 py-1 rounded-lg bg-white text-sky-900 shadow" : "px-2 py-1 rounded-lg";
    
    if(lang === 'zh') {
      document.querySelector('.id-zh').classList.remove('hidden');
      document.querySelector('.id-th').classList.add('hidden');
    } else {
      document.querySelector('.id-zh').classList.add('hidden');
      document.querySelector('.id-th').classList.remove('hidden');
    }
    
    document.getElementById('lblInspector').innerText = p.lblInspector;
    document.getElementById('inspector').placeholder = p.placeholderInspector;
    
    const displayType = lang === 'zh' ? currentWorkType : (currentWorkType === "常規點檢" ? p.routine : p.clean);
    document.getElementById('locationDisplay').innerHTML = `${p.location}${dbLocation} <span class="text-blue-600 font-black ml-1">(${displayType})</span>`;
    
    document.getElementById('lblReportTitle').innerText = p.reportTitle;
    document.getElementById('btnViewReport').innerText = p.viewReport;
    
    if (dbStatusText) {
      document.getElementById('statusDisplay').innerHTML = `${p.statusText}<span class="text-blue-700 font-black">${dbStatusText}${p.passTag}</span>`;
    }
    
    document.getElementById('lblConfirmTitle').innerText = p.confirmTitle;
    document.getElementById('btnSubmitNormal').innerText = p.btnNormal;
    document.getElementById('btnSubmitAbnormal').innerText = p.btnAbnormal;
    
    document.getElementById('lblAbnormalTitle').innerText = p.abTitle;
    document.getElementById('reason').placeholder = p.placeholderReason;
    document.getElementById('btnConfirmAbnormal').innerText = p.abSend;
    document.getElementById('btnFinish').innerText = p.finish;
    
    if (!document.getElementById('lockUI').classList.contains('hidden')) {
      document.getElementById('lockTitle').innerText = p.alreadyDone;
    }
    
    const checkItemsUl = document.getElementById('checkItems');
    checkItemsUl.innerHTML = p.items.map(item => `
      <li class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
        <span class="text-sky-500 font-black">✓</span>
        <span class="text-[12px] font-bold text-slate-600">${item}</span>
      </li>
    `).join('');
    
    const chipsDiv = document.getElementById('abnormalChips');
    chipsDiv.innerHTML = p.chips.map(chip => {
      const isSelected = selectedAbnormalItems.has(chip);
      return `<button type="button" onclick="toggleChip(this)" class="chip px-3 py-2 bg-white rounded-lg text-[11px] font-bold text-red-600 ${isSelected ? 'selected' : ''}">${chip}</button>`;
    }).join('');
  }

  window.onload = async () => {
    const savedName = localStorage.getItem('wd_inspector');
    if (savedName) document.getElementById('inspector').value = savedName;
    
    const urlParams = new URLSearchParams(window.location.search);
    const eqId = urlParams.get('eqId') || urlParams.get('id');
    
    if (eqId) {
      const cleanEqId = eqId.trim().toUpperCase(); 
      
      // 🛑 網址輸入防呆：如果網址參數誤帶消防編號，立即直接跳轉
      if (handleCrossSystemRedirect(cleanEqId)) return;

      document.getElementById('displayId').innerText = cleanEqId;
      document.getElementById('displayId').classList.remove('text-red-500');
      
      currentWorkType = cleanEqId.includes("WD") ? "常規點檢" : "清洗保養";

      if (window.wdDoneList.has(cleanEqId) || localStorage.getItem(getInspectedKey(cleanEqId)) === 'true') {
        showLockedUI(cleanEqId);
        document.getElementById('reportCard').classList.remove('force-hide');
        switchLang('zh');
        try {
          const res = await fetch(READ_API, { method: 'POST', body: JSON.stringify({}) });
          const data = await res.json();
          const list = data.deviceDetails || data.value || data || [];
          const currentDevice = Array.isArray(list) ? list.find(item => {
            const excelKey = (item["設備編號"] || item["設備編號 "] || "").toString().trim().toUpperCase();
            return excelKey === cleanEqId;
          }) : null;
          if (currentDevice) {
            realPdfNameZh = (currentDevice["最新報告網址"] || "").toString().trim();
            realPdfNameTh = (currentDevice["最新報告網址_泰文"] || "").toString().trim();
          }
        } catch(e){}
        return;
      }
      
      try {
        const res = await fetch(READ_API, { method: 'POST', body: JSON.stringify({}) });
        const data = await res.json();
        const list = data.deviceDetails || data.value || data || [];
        
        if (data.doneList && JSON.stringify(data.doneList).toUpperCase().includes(cleanEqId)) {
          showLockedUI(cleanEqId);
          return;
        }

        const currentDevice = Array.isArray(list) ? list.find(item => {
          const excelKey = (item["設備編號"] || item["設備編號 "] || "").toString().trim().toUpperCase();
          return excelKey === cleanEqId;
        }) : null;
        
        if (currentDevice) {
          dbLocation = (currentDevice["正確位置"] || currentDevice["正確位置 "] || currentDevice["廠區位置"] || "茶水間").toString().trim();
          
          let rawStatus = currentDevice["最新檢測狀態"] || currentDevice["最新檢測狀態 "];
          dbStatusText = parseExcelDate(rawStatus) || "已公告";
          
          realPdfNameZh = (currentDevice["最新報告網址"] || "").toString().trim();
          realPdfNameTh = (currentDevice["最新報告網址_泰文"] || "").toString().trim();
          
          document.getElementById('mainUI').classList.remove('force-hide');
          document.getElementById('reportCard').classList.remove('force-hide');
          switchLang('zh'); 
        } else {
          document.getElementById('locationDisplay').innerHTML = `<span class="text-red-500 font-bold">⚠️ Excel 清單中找不到此飲水機編號 [${cleanEqId}]</span>`;
        }
      } catch (e) { 
        document.getElementById('locationDisplay').innerText = `暫時無法連線後端 API 獲取設備資料`; 
      }
    } else {
      document.getElementById('displayId').innerText = "請掃描 QR Code";
      document.getElementById('locationDisplay').innerHTML = `<span class='text-red-500 font-bold'>⚠️ ${langPack[currentLang].scanQrPrompt}</span>`;
    }
  };

  async function viewPdfReport() {
    const targetFileName = currentLang === 'zh' ? realPdfNameZh : realPdfNameTh;
    if (!targetFileName) {
      alert(currentLang === 'zh' ? "Excel 中此設備無登記報告檔案名稱！" : "ไม่มีชื่อไฟล์รายงานใน Excel");
      return;
    }
    
    alert(currentLang === 'zh' ? `正在從雲端調閱：\n[${targetFileName}]` : `กำลังดึงข้อมูลรายงาน：\n[${targetFileName}]`);
    
    try {
      const response = await fetch(DOWNLOAD_FILE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fileName: targetFileName })
      });
      if (response.ok) {
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        window.open(blobUrl, '_blank'); 
      } else { 
        alert(`調閱檔案失敗！請確認該檔案已上傳至專用資料夾中。\n檔名應為：${targetFileName}`); 
      }
    } catch(e) { 
      alert(langPack[currentLang].netFail); 
    }
  }

  function toggleChip(btn) {
    const item = btn.innerText;
    if (selectedAbnormalItems.has(item)) { selectedAbnormalItems.delete(item); btn.classList.remove('selected'); }
    else { selectedAbnormalItems.add(item); btn.classList.add('selected'); }
  }
  
  function showAbnormal() { document.getElementById('abnormalForm').classList.toggle('hidden'); }
  
  async function submitData(status) {
    if (isSubmitting) return;

    const inspector = document.getElementById('inspector').value;
    if (!inspector) { alert(langPack[currentLang].alertName); return; }
    
    const currentId = document.getElementById('displayId').innerText;
    if (currentId === "請掃描 QR Code" || currentId === "") { return; }

    if (window.wdDoneList.has(currentId)) {
      alert('🛑 此設備剛才已完成點檢！');
      showLockedUI(currentId);
      return;
    }
    
    isSubmitting = true;
    localStorage.setItem('wd_inspector', inspector);
    
    let uploadReason = '無';
    if(status === '異常') {
      let mappedChips = [];
      selectedAbnormalItems.forEach(val => {
        if (val === "หน้าจอไม่แสดงผล" || val === "面板無顯示") mappedChips.push("面板無顯示");
        if (val === "น้ำรั่วซึม" || val === "機身漏水") mappedChips.push("機身漏水");
        if (val === "น้ำมีกลิ่นผิดปกติ" || val === "出水有異味") mappedChips.push("出水有異味");
        if (val === "ถาดรองน้ำอุดตัน" || val === "接水盤阻塞") mappedChips.push("接水盤阻塞");
      });
      if (mappedChips.length === 0) mappedChips = Array.from(selectedAbnormalItems);
      uploadReason = mappedChips.join(',') + ' ' + document.getElementById('reason').value;
    }

    const payload = { 
      equipmentId: currentId, 
      inspector, 
      status: status === '正常' ? '正常' : '異常', 
      maintenanceItem: currentWorkType, 
      reason: uploadReason, 
      location: dbLocation, 
      timestamp: (() => {
  const now = new Date();
  const tzoffset = now.getTimezoneOffset() * 60000; // 取得當地時區偏移量
  const localISOTime = (new Date(now.getTime() - tzoffset)).toISOString().slice(0, -1);
  return localISOTime;
})() 
    };
    
    document.getElementById('msg').classList.remove('hidden');
    document.getElementById('statusText').innerText = langPack[currentLang].sending;
    
    try {
      const response = await fetch(WD_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (response.ok) { 
        window.wdDoneList.add(currentId);
        try { localStorage.setItem(getInspectedKey(currentId), 'true'); } catch(e) {}

        document.getElementById('statusIcon').innerText = "✅"; 
        document.getElementById('statusText').innerText = langPack[currentLang].success; 
        
        document.getElementById('btnFinish').onclick = () => {
          document.getElementById('msg').classList.add('hidden');
          showLockedUI(currentId);
        };
      } else { 
        document.getElementById('statusIcon').innerText = "❌"; 
        document.getElementById('statusText').innerText = langPack[currentLang].fail;
        isSubmitting = false;
      }
    } catch (e) { 
      document.getElementById('statusIcon').innerText = "❌"; 
      alert(langPack[currentLang].netFail);
      document.getElementById('msg').classList.add('hidden');
      isSubmitting = false;
    }
  }
</script>
</body>
</html>
